name: Update YouTube videos
on:
  schedule:
    - cron: "17 19 * * *"   # 每天台灣時間 03:17
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: videos
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch channel RSS and write data/videos.json
        run: |
          set -e
          CH=UCSqZFDGsO5xHP9JeqJdxNMA
          curl -fsSL "https://www.youtube.com/feeds/videos.xml?channel_id=$CH" -o /tmp/yt.xml
          curl -fsSL -A "Mozilla/5.0" "https://www.youtube.com/@Bin0958" -o /tmp/ch.html || true
          node - <<'EOF'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/yt.xml','utf8');
          const un=t=>String(t||'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
          const entries=[...s.matchAll(/<entry>([\s\S]*?)<\/entry>/g)].map(m=>m[1]);
          const videos=entries.map(e=>({id:(e.match(/<yt:videoId>([^<]+)/)||[])[1],title:un((e.match(/<title>([^<]+)/)||[])[1]),published:((e.match(/<published>([^<]+)/)||[])[1]||'').slice(0,10),views:+((e.match(/views="(\d+)"/)||[])[1]||0)})).filter(v=>v.id);
          let prev={};try{prev=JSON.parse(fs.readFileSync('data/videos.json','utf8'));}catch(e){}
          let avatar=(prev.channel||{}).avatar||'';
          try{const h=fs.readFileSync('/tmp/ch.html','utf8');const m=h.match(/"avatar":\{"thumbnails":\[\{"url":"([^"]+)"/);if(m)avatar=m[1];}catch(e){}
          const out={channel:{id:'UCSqZFDGsO5xHP9JeqJdxNMA',name:un((s.match(/<name>([^<]+)/)||[])[1])||(prev.channel||{}).name||'台中房地產_蘇聖斌',url:'https://www.youtube.com/@Bin0958',avatar},updated:new Date().toISOString().slice(0,10),videos};
          const a=JSON.stringify({c:out.channel,v:out.videos}),b=JSON.stringify({c:prev.channel,v:prev.videos});
          if(a===b){console.log('no change');process.exit(0);}
          fs.mkdirSync('data',{recursive:true});fs.writeFileSync('data/videos.json',JSON.stringify(out,null,1)+'\n');console.log('updated',videos.length,'videos');
          EOF
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/videos.json; then echo "nothing to commit"; exit 0; fi
          git add data/videos.json
          git commit -m "自動更新 YouTube 影片清單"
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
